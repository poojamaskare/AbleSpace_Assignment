services:
  - type: web
    name: ablespace-api
    runtime: node
    rootDir: api
    plan: free
    region: singapore
    # --include=dev: Render sets NODE_ENV=production, which makes npm ci skip
    # devDependencies — where the nest and prisma CLIs live.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Migrations run at start, not build: Render's build step has no guaranteed
    # network path to the database, the runtime one does.
    startCommand: npx prisma migrate deploy && node dist/main
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Direct Neon string, not the -pooler one: migrate deploy's advisory lock
      # hangs forever through pgbouncer and the service never binds a port.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN # https://<your-app>.vercel.app
        sync: false
      - key: JWT_SECRET
        generateValue: true
