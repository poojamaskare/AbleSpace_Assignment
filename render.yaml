services:
  - type: web
    name: ablespace-api
    runtime: node
    rootDir: api
    plan: free
    region: singapore
    # --include=dev: Render sets NODE_ENV=production, which makes npm ci skip
    # devDependencies — where the nest and prisma CLIs live.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # ponytail: migrations are applied by hand (`npx prisma migrate deploy` from
    # a laptop) rather than gating startup. Through Neon's pooler the advisory
    # lock hangs forever; the direct host isn't reachable from here. Two schema
    # changes total — not worth a release pipeline. Move it back into the start
    # command if deploys ever outpace someone remembering to run it.
    startCommand: node dist/main
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Pooled Neon string (`-pooler`): runtime only, migrations are applied by
      # hand from a laptop (see the startCommand note above).
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN # https://<your-app>.vercel.app
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Google sign-in. Leave unset and the login button stays disabled.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
